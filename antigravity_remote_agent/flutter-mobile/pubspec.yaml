name: antigravity_mobile
description: Flutter mobile client for Antigravity remote control
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  web_socket_channel: ^2.4.0
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  uuid: ^4.2.1
  intl: ^0.19.0
  json_annotation: ^4.8.1
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - .env

